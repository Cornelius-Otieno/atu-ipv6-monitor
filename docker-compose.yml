version: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: atu_ipv6
      POSTGRES_USER: atu_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U atu_user -d atu_ipv6']
      interval: 10s
      retries: 5

  app:
    build: .
    ports:
      - '127.0.0.1:3001:3000'
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://atu_user:${POSTGRES_PASSWORD}@db:5432/atu_ipv6?connect_timeout=15
      ETL_SECRET: ${ETL_SECRET:?Set ETL_SECRET in .env}
      CRON_SECRET: ${CRON_SECRET:?Set CRON_SECRET in .env}
      CLOUDFLARE_RADAR_TOKEN: ${CLOUDFLARE_RADAR_TOKEN:-}
      NEXT_PUBLIC_APP_NAME: ATU Africa IPv6 Monitor
      NEXTAUTH_URL: ${NEXTAUTH_URL:?Set NEXTAUTH_URL in .env}
    restart: unless-stopped

volumes:
  pgdata:
