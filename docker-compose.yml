version: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: atu_ipv6
      POSTGRES_USER: atu_user
      POSTGRES_PASSWORD: change_me_in_production
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U atu_user -d atu_ipv6']
      interval: 10s
      retries: 5

  app:
    build: .
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://atu_user:change_me_in_production@db:5432/atu_ipv6?connect_timeout=15
      ETL_SECRET: ${ETL_SECRET:-change_me}
      CRON_SECRET: ${CRON_SECRET:-change_me}
      CLOUDFLARE_RADAR_TOKEN: ${CLOUDFLARE_RADAR_TOKEN:-}
      NEXT_PUBLIC_APP_NAME: ATU Africa IPv6 Monitor
      NEXTAUTH_URL: http://localhost:3000
    restart: unless-stopped

volumes:
  pgdata:
